name: 每日债券爬虫

on:
  schedule:
    # 每天早上 8:00（UTC+8，即 UTC 0:00）执行
    - cron: '0 0 * * *'
  # 也支持手动触发
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行爬虫
        id: run_scripts
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python run_all.py 2>&1

      - name: 上传下载的 PDF 文件（作为 Action Artifacts）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-pdfs-${{ github.run_id }}
          path: |
            province_bonds_disclosure/
            province_bonds_summary/
          retention-days: 7
          if-no-files-found: warn

      - name: 通知结果
        if: always()
        run: |
          echo "✅ 当日爬虫执行完毕（PushPlus 通知已在 run_all.py 中处理）"
